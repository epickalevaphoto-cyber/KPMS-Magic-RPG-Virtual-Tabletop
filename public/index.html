<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPMS — Harry Potter RPG VTT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 32px; border-radius: 12px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 8px; }
        p { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
        .badge { display: inline-block; background: #0284c7; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 20px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #7dd3fc; }
        #response { margin-top: 15px; font-size: 0.9rem; color: #4ade80; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>KPMS VTT</h1>
        <div class="badge">Node.js Server Active</div>
        <p>Виртуальный стол для маго-детективных расследований и дуэлей</p>
        <button onclick="checkServer()">Проверить связь с сервером</button>
        <div id="response"></div>
    </div>

    <script>
        async function checkServer() {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('response').innerText = `Ответ сервера: ${data.status}`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Веб-Сайт</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 16px;
            font-size: 2rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .status {
            margin-top: 20px;
            font-weight: bold;
            color: #4ade80;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Добро пожаловать!</h1>
        <p>Этот сайт успешно запущен с помощью GitHub и бесплатного хостинга Render.</p>
        <button class="btn" onclick="handleClick()">Нажми на меня</button>
        <div id="output" class="status"></div>
    </div>

    <script>
        function handleClick() {
            const output = document.getElementById('output');
            output.innerText = 'Кнопка работает! Интерактивность подключена.';
        }
    </script>
</body>
</html>
